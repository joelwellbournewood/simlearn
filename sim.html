<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>SimLearn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="sim-page">
<header class="site-header">
  <a href="index.html" class="logo">Sim<span>Learn</span></a>
  <span class="chrome-note"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/><path d="M12 8.6H21M8.9 13.7 4.4 21M15.1 13.7 10.6 21"/></svg>Runs best on Google Chrome</span>
  <nav>
    <a href="index.html">Simulations</a>
    <a href="about.html">About</a>
  </nav>
</header>

<div class="sim-header">
  <a class="back" href="index.html">&larr; All</a>
  <h1 id="sim-title">Loading&#8230;</h1>
  <p id="sim-desc"></p>
  <button type="button" class="fs-btn" id="fs-btn">Fullscreen</button>
</div>

<div class="sim-frame-wrap">
  <iframe id="sim-frame" class="sim-frame" title="Simulation" allowfullscreen sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const frame = document.getElementById('sim-frame');

  fetch('sims/manifest.json')
    .then(r => r.json())
    .then(sims => {
      const sim = sims.find(s => s.id === id);
      if (!sim) {
        document.getElementById('sim-title').textContent = 'Simulation not found';
        return;
      }
      document.getElementById('sim-title').textContent = sim.title;
      document.getElementById('sim-desc').textContent = sim.description;
      document.title = sim.title + ' \u2014 SimLearn';
      if (sim.status && sim.status !== 'live') {
        document.getElementById('fs-btn').style.display = 'none';
        frame.remove();
        var ph = document.createElement('div');
        ph.className = 'sim-placeholder';
        ph.innerHTML = '<p class="eyebrow">In development</p>' +
          '<p>This simulation is not published yet.</p>' +
          '<p><a href="index.html">Browse the published simulations</a></p>';
        document.querySelector('.sim-frame-wrap').appendChild(ph);
        return;
      }
      frame.src = 'sims/' + sim.id + '/index.html';
    });

  const fsBtn = document.getElementById('fs-btn');
  fsBtn.addEventListener('click', function () {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (frame.requestFullscreen) { frame.requestFullscreen(); }
  });
  document.addEventListener('fullscreenchange', function () {
    fsBtn.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
  });
</script>
</body>
</html>
